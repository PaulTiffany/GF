name: GF — render GIF

on:
  workflow_dispatch:
  push:
    paths:
      - "gf.py"
      - "requirements.txt"
      - "examples/**"
      - ".github/workflows/gf.yml"

permissions:
  contents: write

jobs:
  rush:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the build
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Equip
        run: python -m pip install --requirement requirements.txt

      - name: Rush
        run: python gf.py examples/lattice-animal.json out/lattice-animal.gif

      - name: Keep the drop
        uses: actions/upload-artifact@v4
        with:
          name: lattice-animal
          path: |
            out/lattice-animal.gif
            out/lattice-animal.png
          if-no-files-found: error

      - name: Put the drop in the ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/lattice-animal.gif out/lattice-animal.png
          git diff --cached --quiet && exit 0
          git commit -m "Render lattice animal [skip ci]"
          git push
