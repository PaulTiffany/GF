name: GF — certified serving

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gf.py"
      - "serve.py"
      - "requirements.txt"
      - "examples/**"
      - ".github/workflows/serve.yml"
  pull_request:
    paths:
      - "gf.py"
      - "serve.py"
      - "requirements.txt"
      - "examples/**"
      - ".github/workflows/serve.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build serving bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --requirement requirements.txt

      - name: Render
        run: python gf.py examples/lattice-animal.json out/lattice-animal.gif

      - name: Build certified bundle
        run: >
          python serve.py build
          --base-url https://paultiffany.github.io/GF
          --commit "$GITHUB_SHA"

      - name: Check bundle locally
        run: |
          test -s _site/lattice-animal.png
          test -s _site/lattice-animal.gif
          test -s _site/manifest.json
          test -s _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    name: deploy and certify
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4

      - name: Probe canonical endpoints
        run: >
          python serve.py probe
          --base-url https://paultiffany.github.io/GF
          --attempts 12
