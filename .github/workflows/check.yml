name: GF — check builds

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "gf.py"
      - "catalog.py"
      - "catalog.json"
      - "skills/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --requirement requirements.txt
      - run: python catalog.py check
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/player.test.cjs

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: skills/tool-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/tool-dashboard/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-evidence
          path: skills/tool-dashboard/test-output/
          if-no-files-found: ignore
          retention-days: 7
