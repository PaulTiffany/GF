name: pr-policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: human gate for main
    runs-on: ubuntu-latest
    steps:
      - uses: Tiffany-Studios/pr-readback@v1
        with:
          guidance: See the pull request template. Agents open drafts; a human reads the diff, ticks the review box, and marks it ready.
